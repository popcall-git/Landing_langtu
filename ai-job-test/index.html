<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💼 打工人饭碗保卫战生存测试</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; overflow: hidden; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); min-height: 100vh; }
        .page-container { width: 100vw; height: 100vh; position: relative; overflow: hidden; }
        .bg-pattern { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(circle at 20% 80%, rgba(233, 69, 96, 0.1) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(0, 212, 170, 0.1) 0%, transparent 50%), radial-gradient(circle at 50% 50%, rgba(255, 193, 7, 0.05) 0%, transparent 70%); pointer-events: none; }
        .floating-icons { position: absolute; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
        .float-icon { position: absolute; font-size: 24px; opacity: 0.1; animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(10deg); } }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; padding: 20px; overflow-y: auto; }
        .screen.active { display: flex; }
        .home-screen { justify-content: center; text-align: center; }
        .home-badge { background: linear-gradient(135deg, #e94560, #ff6b6b); color: white; padding: 8px 20px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: 2px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4); }
        .home-title { font-size: 32px; font-weight: 900; color: #fff; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); line-height: 1.3; }
        .home-subtitle { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 30px; line-height: 1.6; }
        .home-features { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
        .feature-item { display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,0.8); font-size: 13px; }
        .feature-icon { width: 24px; height: 24px; background: rgba(0, 212, 170, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .home-stats { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-item { text-align: center; }
        .stat-number { font-size: 24px; font-weight: 900; color: #00d4aa; }
        .stat-label { font-size: 10px; color: rgba(255,255,255,0.5); }
        .cta-button { width: 80%; max-width: 300px; height: 50px; background: linear-gradient(135deg, #00d4aa, #00b894); border: none; border-radius: 25px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 20px rgba(0, 212, 170, 0.4); transition: all 0.3s ease; }
        .cta-button:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(0, 212, 170, 0.6); }
        .quiz-screen { padding-top: 60px; }
        .quiz-header { position: fixed; top: 0; left: 0; width: 100%; padding: 15px 20px; background: rgba(26, 26, 46, 0.95); backdrop-filter: blur(10px); z-index: 100; }
        .quiz-progress { display: flex; align-items: center; gap: 10px; }
        .progress-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00d4aa, #00b894); border-radius: 3px; transition: width 0.3s ease; }
        .progress-text { font-size: 12px; color: rgba(255,255,255,0.6); min-width: 45px; }
        .quiz-content { width: 100%; max-width: 400px; margin-top: 20px; }
        .question-number { font-size: 12px; color: #00d4aa; font-weight: 600; margin-bottom: 10px; }
        .question-title { font-size: 18px; font-weight: 700; color: #fff; line-height: 1.6; margin-bottom: 8px; }
        .question-subtitle { font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 25px; padding: 8px 12px; background: rgba(255,255,255,0.05); border-radius: 8px; border-left: 3px solid #e94560; }
        .options-container { display: flex; flex-direction: column; gap: 12px; }
        .option-item { padding: 16px 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: rgba(255,255,255,0.9); font-size: 14px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: flex-start; gap: 12px; }
        .option-item:hover { background: rgba(0, 212, 170, 0.1); border-color: rgba(0, 212, 170, 0.3); transform: translateX(5px); }
        .option-tag { width: 28px; height: 28px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #00d4aa; flex-shrink: 0; }
        .option-text { line-height: 1.5; }
        .result-screen { padding-top: 40px; padding-bottom: 40px; }
        .result-card { width: 90%; max-width: 380px; background: rgba(255,255,255,0.05); border-radius: 20px; padding: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .result-type { display: inline-block; padding: 6px 16px; border-radius: 15px; font-size: 12px; font-weight: 700; margin-bottom: 15px; }
        .result-type.danger { background: rgba(233, 69, 96, 0.2); color: #e94560; }
        .result-type.warning { background: rgba(255, 193, 7, 0.2); color: #ffc107; }
        .result-type.safe { background: rgba(0, 212, 170, 0.2); color: #00d4aa; }
        .result-title { font-size: 22px; font-weight: 900; color: #fff; margin-bottom: 10px; }
        .result-probability { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 20px; }
        .result-probability strong { color: #e94560; font-size: 18px; }
        .result-section { margin-bottom: 20px; }
        .section-title { font-size: 13px; font-weight: 700; color: #00d4aa; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .section-content { font-size: 13px; color: rgba(255,255,255,0.8); line-height: 1.8; }
        .expert-quote { background: rgba(0, 212, 170, 0.1); border-left: 3px solid #00d4aa; padding: 12px 15px; border-radius: 0 8px 8px 0; margin-top: 15px; }
        .expert-quote-title { font-size: 11px; color: #00d4aa; font-weight: 600; margin-bottom: 5px; }
        .share-section { width: 90%; max-width: 380px; background: linear-gradient(135deg, rgba(233, 69, 96, 0.15), rgba(255, 107, 107, 0.1)); border: 1px solid rgba(233, 69, 96, 0.3); border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .share-title { font-size: 16px; font-weight: 800; color: #e94560; margin-bottom: 10px; }
        .share-desc { font-size: 13px; color: rgba(255,255,255,0.8); line-height: 1.6; margin-bottom: 15px; }
        .share-desc strong { color: #ffc107; }
        .share-button { width: 100%; padding: 14px 0; background: linear-gradient(135deg, #e94560, #ff6b6b); border: none; border-radius: 25px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
        .share-stats { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 12px; }
        .action-buttons { display: flex; flex-direction: column; gap: 12px; width: 90%; max-width: 380px; }
        .action-btn { padding: 14px 0; border-radius: 25px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; }
        .action-btn.primary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .action-btn.secondary { background: transparent; color: rgba(255,255,255,0.6); }
        @media (max-height: 700px) { .home-title { font-size: 26px; } .question-title { font-size: 16px; } }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="bg-pattern"></div>
        <div class="floating-icons">
            <span class="float-icon" style="top: 10%; left: 10%; animation-delay: 0s;">💼</span>
            <span class="float-icon" style="top: 20%; right: 15%; animation-delay: 1s;">🤖</span>
            <span class="float-icon" style="top: 60%; left: 8%; animation-delay: 2s;">⚡</span>
            <span class="float-icon" style="bottom: 20%; right: 10%; animation-delay: 3s;">🔥</span>
        </div>
        
        <div class="screen home-screen active" id="homeScreen">
            <div class="home-badge">🔥 AI时代生存指南</div>
            <h1 class="home-title">打工人饭碗<br>保卫战生存测试</h1>
            <p class="home-subtitle">15道题，测测你的工作<br>在未来5年会不会被AI抢走</p>
            <div class="home-features">
                <div class="feature-item"><span class="feature-icon">✓</span>没有标准答案，按真实情况选择</div>
                <div class="feature-item"><span class="feature-icon">✓</span>基于花旗银行AI替代研究报告</div>
                <div class="feature-item"><span class="feature-icon">✓</span>专家大白话解读你的职业风险</div>
            </div>
            <div class="home-stats">
                <div class="stat-item"><div class="stat-number">15</div><div class="stat-label">道测试题</div></div>
                <div class="stat-item"><div class="stat-number">4</div><div class="stat-label">种结果类型</div></div>
                <div class="stat-item"><div class="stat-number">5年</div><div class="stat-label">预测周期</div></div>
            </div>
            <button class="cta-button" onclick="startQuiz()">开始测试 →</button>
        </div>
        
        <div class="screen quiz-screen" id="quizScreen">
            <div class="quiz-header">
                <div class="quiz-progress">
                    <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
                    <span class="progress-text" id="progressText">1/15</span>
                </div>
            </div>
            <div class="quiz-content">
                <div class="question-number" id="questionNumber">第 1 题</div>
                <div class="question-title" id="questionTitle">题目加载中...</div>
                <div class="question-subtitle" id="questionSubtitle">副标题加载中...</div>
                <div class="options-container" id="optionsContainer"></div>
            </div>
        </div>
        
        <div class="screen result-screen" id="resultScreen">
            <div class="result-card">
                <span class="result-type" id="resultType">结果类型</span>
                <h2 class="result-title" id="resultTitle">结果标题</h2>
                <p class="result-probability" id="resultProbability">替代概率</p>
                <div class="result-section">
                    <div class="section-title">📊 风险画像</div>
                    <div class="section-content" id="riskProfile">风险描述</div>
                </div>
                <div class="expert-quote">
                    <div class="expert-quote-title">💡 专家大白话</div>
                    <div class="section-content" id="expertAdvice">专家建议</div>
                </div>
            </div>
            <div class="share-section">
                <div class="share-title">📤 分享给好友</div>
                <div class="share-desc">看看身边有多少人和你一样<br>处于<strong>AI替代风险区</strong></div>
                <button class="share-button" onclick="shareResult()">立即分享测试结果</button>
                <div class="share-stats">已有 128,476 人完成测试</div>
            </div>
            <div class="action-buttons">
                <button class="action-btn primary" onclick="retakeQuiz()">再测一次</button>
                <button class="action-btn secondary" onclick="goHome()">返回首页</button>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            { question: "每天上班第一件事，你主要面对啥？", subtitle: "工作环境决定了AI能否轻易介入", options: [{ text: "电脑屏幕，屁股一坐一整天，主打一个'颈椎杀手'", type: "A", weight: 2 }, { text: "一半在电脑前，一半要在现实里走动、开会、见不同的人", type: "B", weight: 1 }, { text: "户外大自然，或者充满机器、工具的施工/物理现场", type: "C", weight: 0 }] },
            { question: "如果今天全城断网停电，你的工作还能接着干吗？", subtitle: "数字依赖度 = AI替代潜力", options: [{ text: "彻底废了，只能去茶水间摸鱼聊天", type: "A", weight: 2 }, { text: "还能干一部分，比如开个线下的头脑风暴会", type: "B", weight: 1 }, { text: "毫无影响，照样抡大锤/跑长途/修水管/端盘子", type: "C", weight: 0 }] },
            { question: "你的工作对体力的要求是？", subtitle: "体力劳动是AI最难跨越的护城河", options: [{ text: "主要是消耗眼睛和手指头（标准的'键盘侠'）", type: "A", weight: 2 }, { text: "需要走动安抚别人，或者一直站着讲话", type: "B", weight: 1 }, { text: "微信步数天天一两万起步，或者经常需要搬重物", type: "C", weight: 0 }] },
            { question: "你的工作环境有多少'不可控的惊吓'？", subtitle: "AI擅长处理确定性，不擅长应对混沌", options: [{ text: "几乎没有，最不可控的就是电脑死机", type: "A", weight: 2 }, { text: "有一些，比如客户临时改需求、病人突然情绪失控", type: "B", weight: 1 }, { text: "全是意外！比如下大雨、狗咬人、路上堵死", type: "C", weight: 0 }] },
            { question: "你的工作主要是'搬运'还是'创造'？", subtitle: "重复性工作最容易被AI自动化", options: [{ text: "搬运+整理。比如把数据从这个表复制到那个表", type: "A", weight: 2 }, { text: "创造+动脑。比如写代码、画图、搞科研、写策划", type: "B", weight: 1 }, { text: "动手+出汗。纯靠手艺、肌肉记忆或肌肉力量吃饭", type: "C", weight: 0 }] },
            { question: "你觉得自己的工作像流水线吗？", subtitle: "标准化程度越高，AI越容易学习", options: [{ text: "超级像，有固定的SOP，按部就班照着做就行", type: "A", weight: 2 }, { text: "不太像，需要很多复杂的逻辑分析，还得随时变通", type: "B", weight: 1 }, { text: "完全不是，每天面对的实物和突发状况都不一样", type: "C", weight: 0 }] },
            { question: "你的工作需要和人'交心'吗？", subtitle: "情感劳动是AI的短板", options: [{ text: "不需要，最好别跟我说话，发文字就行", type: "A", weight: 2 }, { text: "需要，得安抚情绪、教导别人、进行高情商谈判", type: "B", weight: 1 }, { text: "看情况，但我主要和'毫无感情的物理对象'打交道", type: "C", weight: 0 }] },
            { question: "如果公司招个聪明的实习生顶替你，大概需要多久？", subtitle: "技能门槛越高，AI越难替代", options: [{ text: "只要带个一两周，摸清流程就能上手干七八成", type: "A", weight: 2 }, { text: "就算教他，他也得熬好几年才能积累出我的直觉", type: "B", weight: 1 }, { text: "实习生干不了，他得先去考资格证或练就一身肌肉", type: "C", weight: 0 }] },
            { question: "你现在用过AI（比如ChatGPT或DeepSeek）帮你干活吗？", subtitle: "已经在用AI的人，工作更容易被AI渗透", options: [{ text: "天天用，它能帮我写邮件、做PPT、写水稿", type: "A", weight: 2 }, { text: "偶尔用，主要用来查点资料或者找找灵感", type: "B", weight: 1 }, { text: "啥是DeepSeek？它能帮我通下水道或者开车吗？", type: "C", weight: 0 }] },
            { question: "如果把你的工作内容写成一本操作手册，能写清楚吗？", subtitle: "可文档化 = 可程序化 = AI可学习", options: [{ text: "能，一条一条写得清清楚楚，照着做就行", type: "A", weight: 2 }, { text: "写不清，里面有很多'只可意会不可言传'的创意", type: "B", weight: 1 }, { text: "能写个大概，但手残党看了也学不会，得真刀真枪练", type: "C", weight: 0 }] },
            { question: "揭晓你的真实年龄！", subtitle: "年轻人在AI冲击下更脆弱", options: [{ text: "20-29岁的'脆皮年轻人'", type: "A", weight: 1 }, { text: "30-49岁的职场中坚力量", type: "B", weight: 0.5 }, { text: "50岁以上的'老油条'", type: "C", weight: 0 }] },
            { question: "你在哪个圈子混？", subtitle: "行业决定了AI渗透的速度", options: [{ text: "金融、IT、互联网、广告、各类坐办公室的文职", type: "A", weight: 2 }, { text: "教育、医疗、公检法、高级科研", type: "B", weight: 1 }, { text: "网约车/出租车司机、外卖员、建筑、维修、保洁", type: "C", weight: 0 }] },
            { question: "你每周的真实工作时长大概是？", subtitle: "超长工时是'内卷型'工作的标志", options: [{ text: "48小时以上，疯狂内卷，周末还在回消息", type: "A", weight: 1 }, { text: "标准40小时左右，能保持基本的生活节奏", type: "B", weight: 0.5 }, { text: "灵活就业，跑一单算一单，时间自己定", type: "C", weight: 0 }] },
            { question: "你的核心竞争力是什么？", subtitle: "核心竞争力的可替代性决定命运", options: [{ text: "我熟练掌握办公软件，打字贼快，做事仔细不出错", type: "A", weight: 2 }, { text: "我有极强的逻辑推理能力，能解决复杂难题", type: "B", weight: 1 }, { text: "我能熟练操作某种机器，或者我的身体抗造", type: "C", weight: 0 }] },
            { question: "坦白局：如果明天你所在的行业突然大裁员，你的'终极退路（Plan B）'是什么？", subtitle: "你的退路选择，暴露了你的职业护城河深度", options: [{ text: "赶紧投简历，换个行业继续找个坐在电脑前的安稳班上，比如做做后勤、数据录入或普通客服", type: "A", weight: 2 }, { text: "靠我这几年积攒的行业洞察和解决复杂问题的经验，转型做高级顾问，或者用AI武装自己单干", type: "B", weight: 1 }, { text: "彻底不在写字楼里卷了，大不了去跑网约车、送外卖，或者干个需要真刀真枪动手的线下买卖", type: "C", weight: 0 }] }
        ];

        let currentQuestion = 0, scores = { A: 0, B: 0, C: 0 };

        function startQuiz() {
            document.getElementById('homeScreen').classList.remove('active');
            document.getElementById('quizScreen').classList.add('active');
            showQuestion();
        }

        function showQuestion() {
            const q = quizData[currentQuestion];
            document.getElementById('progressBar').style.width = ((currentQuestion / quizData.length) * 100) + '%';
            document.getElementById('progressText').textContent = (currentQuestion + 1) + '/' + quizData.length;
            document.getElementById('questionNumber').textContent = '第 ' + (currentQuestion + 1) + ' 题';
            document.getElementById('questionTitle').textContent = q.question;
            document.getElementById('questionSubtitle').textContent = q.subtitle;
            document.getElementById('optionsContainer').innerHTML = q.options.map((opt, i) => 
                '<div class="option-item" onclick="selectOption(' + i + ')"><span class="option-tag">' + String.fromCharCode(65 + i) + '</span><span class="option-text">' + opt.text + '</span></div>'
            ).join('');
        }

        function selectOption(index) {
            const opt = quizData[currentQuestion].options[index];
            scores[opt.type] += opt.weight;
            currentQuestion++;
            if (currentQuestion < quizData.length) showQuestion();
            else showResult();
        }

        function showResult() {
            document.getElementById('quizScreen').classList.remove('active');
            document.getElementById('resultScreen').classList.add('active');
            
            let resultType, resultTitle, probability, riskProfile, expertAdvice;
            
            if (scores.A >= scores.B && scores.A >= scores.C && scores.A >= 8) {
                resultType = 'danger'; resultTitle = '直接被端走饭碗的"重灾区"';
                probability = '未来5年被替代概率：<strong>90%以上</strong>';
                riskProfile = '你每天几乎100%在电脑前工作，且内容偏向常规的数据处理、流程审批或简单的文字撰写。在AI眼里，你的工作属于"满分暴露度"（10分）。';
                expertAdvice = '根据花旗银行的测算，中国约有9.6%（近7000万人）正面临这种直接被替代的风险。特别是如果你还是20-29岁、身处金融或IT行业的年轻人（占比13.6%处于高危），你的危险系数比50岁的老员工还要高出一大截。AI已经不仅能做你的工作，还能做得比你快1万倍，你现在需要立刻开始寻找新的技能方向了。';
            } else if (scores.B >= scores.A && scores.B >= scores.C && scores.B >= 5) {
                resultType = 'warning'; resultTitle = '保住了饭碗，但卷到头秃';
                probability = '未来5年被替代概率：<strong>工作不会消失，但岗位数量可能减少</strong>';
                riskProfile = '你是典型的高级脑力劳动者（如程序员、设计师、科研人员、老师）。你的工作不仅数字化程度高，而且需要创意和复杂逻辑。';
                expertAdvice = '好消息是，AI无法完全替代你，反而会变成你手里的"超级外挂"，大幅提升你的效率（花旗报告称中国有21.4%的人属于这一类）。坏消息是，既然一个人加AI就能干三个人的活，老板为什么还要雇三个人呢？这会导致激烈的"间接竞争"——你的工作还在，但同行之间的内卷将变得前所未有地惨烈。目前的超长工时（全国平均48.6小时/周）就是这种疯狂竞争的缩影。';
            } else {
                resultType = 'safe'; resultTitle = '拥有物理护城河的"幸存者"';
                probability = '未来5年被替代概率：<strong>10%以下</strong>';
                riskProfile = '你的工作大多在现实世界中进行，需要动手、流汗，面对各种千奇百怪的突发状况（如水管工、电工、屋顶工、消防员、园林绿化员）。';
                expertAdvice = '恭喜你！在劳工统计局数据的AI暴露度评分中，你只拿了0-3分（极低风险）。目前的AI只是一个极其聪明的"赛博大脑"，它没有手脚。要让机器人在复杂的现实环境里帮你把堵塞的马桶修好，在未来5年内不仅技术极其困难，而且成本高到离谱。在这个AI大爆炸的时代，拥有一门过硬的"手艺活"和强健的体魄，才是最硬核的护城河。';
            }
            
            document.getElementById('resultType').className = 'result-type ' + resultType;
            document.getElementById('resultType').textContent = resultType === 'danger' ? '🔴 高危预警' : resultType === 'warning' ? '🟡 中等风险' : '🟢 相对安全';
            document.getElementById('resultTitle').textContent = resultTitle;
            document.getElementById('resultProbability').innerHTML = probability;
            document.getElementById('riskProfile').textContent = riskProfile;
            document.getElementById('expertAdvice').textContent = expertAdvice;
        }

        function shareResult() {
            const resultTitle = document.getElementById('resultTitle').textContent;
            const shareText = '【AI饭碗保卫战】我的测试结果：' + resultTitle + '！快来测测你的工作会不会被AI抢走→';
            if (navigator.share) navigator.share({ title: '打工人饭碗保卫战生存测试', text: shareText, url: window.location.href });
            else { navigator.clipboard.writeText(shareText + ' ' + window.location.href); alert('测试结果已复制，快去分享给好友吧！'); }
        }

        function retakeQuiz() { currentQuestion = 0; scores = { A: 0, B: 0, C: 0 }; document.getElementById('resultScreen').classList.remove('active'); document.getElementById('quizScreen').classList.add('active'); showQuestion(); }
        function goHome() { currentQuestion = 0; scores = { A: 0, B: 0, C: 0 }; document.getElementById('resultScreen').classList.remove('active'); document.getElementById('homeScreen').classList.add('active'); }
    </script>
</body>
</html>
