<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a5298;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3c72;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffed4e;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bf953f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fcf6ba;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b38728;stop-opacity:1" />
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="640" height="360" fill="url(#bg3)"/>
  
  <!-- 装饰性几何图形 -->
  <rect x="60" y="60" width="80" height="80" fill="url(#accent3)" opacity="0.05" transform="rotate(45 100 100)"/>
  <rect x="500" y="220" width="100" height="100" fill="url(#accent3)" opacity="0.05" transform="rotate(30 550 270)"/>
  <circle cx="120" cy="280" r="40" fill="url(#accent3)" opacity="0.06"/>
  <circle cx="550" cy="100" r="50" fill="url(#accent3)" opacity="0.05"/>
  
  <!-- 经典标识 -->
  <text x="580" y="60" font-size="40" fill="url(#gold)" opacity="0.3">✦</text>
  <text x="70" y="320" font-size="30" fill="url(#gold)" opacity="0.2">✦</text>
  
  <!-- 高跟鞋图标 - 经典款 -->
  <g transform="translate(320, 170)" filter="url(#glow3)">
    <!-- 鞋跟 - 细跟设计 -->
    <path d="M-30,-60 L-30,40 L-22,40 L-22,-50 Q-22,-60 -30,-60" fill="url(#gold)"/>
    <!-- 鞋底 -->
    <path d="M-30,40 Q-10,48 30,42 Q58,37 68,28 Q73,23 68,18 Q63,13 52,16 Q42,18 28,20 Q8,23 -22,18 L-30,40" fill="url(#gold)"/>
    <!-- 鞋面 - 经典浅口 -->
    <ellipse cx="15" cy="-35" rx="35" ry="20" fill="url(#gold)" opacity="0.9"/>
    <path d="M-22,-50 Q0,-75 40,-65 Q55,-60 50,-45 Q45,-35 30,-38 Q10,-40 -22,-35 L-22,-50" fill="url(#gold)"/>
    <!-- 经典装饰线 -->
    <path d="M-15,-45 Q10,-55 35,-48" stroke="white" stroke-width="1.5" fill="none" opacity="0.4"/>
    <!-- 高光 -->
    <ellipse cx="20" cy="-50" rx="10" ry="5" fill="white" opacity="0.4"/>
    <ellipse cx="25" cy="-25" rx="8" ry="4" fill="white" opacity="0.3"/>
  </g>
  
  <!-- 12CM 标识 -->
  <g transform="translate(520, 80)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#gold)">12CM</text>
  </g>
  
  <!-- 标题文字 -->
  <text x="320" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">12CM浅口细跟</text>
  <text x="320" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffd700">经典永不过时</text>
  
  <!-- 装饰线条 -->
  <line x1="200" y1="325" x2="440" y2="325" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="325" r="3" fill="url(#gold)"/>
  <circle cx="440" cy="325" r="3" fill="url(#gold)"/>
</svg>