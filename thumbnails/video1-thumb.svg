<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#302b63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff416c;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ff4b2b;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9966;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff5e62;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff416c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="640" height="360" fill="url(#bg4)"/>
  
  <!-- 装饰性几何图形 -->
  <circle cx="100" cy="80" r="60" fill="url(#accent4)" opacity="0.08"/>
  <circle cx="550" cy="280" r="80" fill="url(#accent4)" opacity="0.08"/>
  <polygon points="50,200 100,150 150,200 100,250" fill="url(#accent4)" opacity="0.05"/>
  <polygon points="500,80 550,40 600,80 550,120" fill="url(#accent4)" opacity="0.05"/>
  
  <!-- 火焰装饰 -->
  <text x="80" y="100" font-size="30" fill="url(#fire)" opacity="0.4">🔥</text>
  <text x="540" y="300" font-size="25" fill="url(#fire)" opacity="0.3">🔥</text>
  <text x="500" y="80" font-size="20" fill="url(#fire)" opacity="0.5">🔥</text>
  
  <!-- 高跟鞋图标 - 极限高跟 -->
  <g transform="translate(320, 170)" filter="url(#glow4)">
    <!-- 超高鞋跟 - 18cm -->
    <path d="M-45,-70 L-45,45 L-32,45 L-32,-60 Q-32,-70 -45,-70" fill="url(#accent4)"/>
    <!-- 鞋底 -->
    <path d="M-45,45 Q-20,55 35,48 Q68,42 80,32 Q86,26 80,20 Q74,14 62,18 Q50,20 35,23 Q10,26 -32,20 L-45,45" fill="url(#accent4)"/>
    <!-- 鞋面 - 超高设计 -->
    <path d="M-32,-60 Q-8,-90 45,-78 Q68,-72 75,-55 Q80,-38 68,-28 Q55,-16 35,-22 Q10,-26 -32,-20 L-32,-60" fill="url(#accent4)" opacity="0.95"/>
    
    <!-- 高度标识 -->
    <line x1="-55" y1="-70" x2="-55" y2="45" stroke="url(#fire)" stroke-width="2" stroke-dasharray="4,2" opacity="0.6"/>
    <text x="-75" y="-10" font-family="Arial, sans-serif" font-size="12" fill="url(#fire)" opacity="0.8">18CM</text>
    
    <!-- 高光 -->
    <ellipse cx="20" cy="-50" rx="15" ry="8" fill="white" opacity="0.35"/>
    <ellipse cx="30" cy="-25" rx="10" ry="5" fill="white" opacity="0.25"/>
    
    <!-- 闪光效果 -->
    <circle cx="50" cy="-60" r="3" fill="white" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 标题文字 -->
  <text x="320" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">超高跟鞋收藏家</text>
  <text x="320" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ff416c">极限高跟展示</text>
  
  <!-- 装饰线条 -->
  <line x1="200" y1="325" x2="440" y2="325" stroke="url(#accent4)" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="325" r="3" fill="url(#accent4)"/>
  <circle cx="440" cy="325" r="3" fill="url(#accent4)"/>
  
  <!-- 时长标识 -->
  <g transform="translate(560, 320)">
    <rect x="-35" y="-12" width="70" height="24" rx="12" fill="rgba(0,0,0,0.6)"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="white" font-weight="600">9:42</text>
  </g>
</svg>