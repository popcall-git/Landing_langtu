<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4a4a68;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ee5a6f;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="640" height="360" fill="url(#bg)"/>
  
  <!-- 装饰性几何图形 -->
  <circle cx="100" cy="80" r="60" fill="url(#accent)" opacity="0.1"/>
  <circle cx="550" cy="280" r="80" fill="url(#accent)" opacity="0.1"/>
  <rect x="50" y="250" width="120" height="120" fill="url(#accent)" opacity="0.05" transform="rotate(15 110 310)"/>
  <rect x="480" y="50" width="100" height="100" fill="url(#accent)" opacity="0.05" transform="rotate(-10 530 100)"/>
  
  <!-- 高跟鞋图标 -->
  <g transform="translate(320, 180)" filter="url(#glow)">
    <!-- 鞋跟 -->
    <path d="M-40,-60 L-40,40 L-30,40 L-30,-50 Q-30,-60 -40,-60" fill="url(#accent)"/>
    <!-- 鞋底 -->
    <path d="M-40,40 Q-20,50 20,45 Q50,40 60,30 Q65,25 60,20 Q55,15 45,18 Q35,20 20,22 Q0,25 -30,20 L-40,40" fill="url(#accent)"/>
    <!-- 鞋面 -->
    <path d="M-30,-50 Q-10,-80 30,-70 Q50,-65 55,-50 Q60,-35 50,-25 Q40,-15 20,-20 Q0,-25 -30,-20 L-30,-50" fill="url(#accent)" opacity="0.9"/>
    <!-- 高光 -->
    <ellipse cx="10" cy="-45" rx="15" ry="8" fill="white" opacity="0.3"/>
  </g>
  
  <!-- 标题文字 -->
  <text x="320" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">反人类设计高跟鞋</text>
  <text x="320" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ff6b6b">最强辅助神器</text>
  
  <!-- 装饰线条 -->
  <line x1="200" y1="330" x2="440" y2="330" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="330" r="3" fill="url(#accent)"/>
  <circle cx="440" cy="330" r="3" fill="url(#accent)"/>
</svg>